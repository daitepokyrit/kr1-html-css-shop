<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Оформление заказа в интернет-магазине.">
    <title>Оформление заказа — Учебный интернет-магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body id="top">
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">ShopProject</a>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
                    <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
                    <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
                    <li class="site-nav__item"><a class="site-nav__link site-nav__link--active"
                            href="order.html">Заказ</a></li>
                    <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                    <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a>
                    </li>
                    <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <span class="breadcrumbs__current">Оформление заявки</span>
        </nav>

        <section class="section">
            <h1>Оформление заказа</h1>
            <form class="order-form" id="page-order-form" action="#" method="post">
                <div class="order-form__field">
                    <label class="order-form__label" for="page-name">Имя</label>
                    <input class="order-form__input" id="page-name" name="name" type="text"
                        placeholder="Введите ваше имя" required minlength="2">
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-email">E-mail</label>
                    <input class="order-form__input" id="page-email" name="email" type="email"
                        placeholder="example@mail.ru" required>
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-phone">Телефон</label>
                    <input class="order-form__input" id="page-phone" name="phone" type="tel"
                        placeholder="+7 (900) 000-00-00" required>
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-topic">Выбор товара</label>
                    <select class="order-form__select" id="page-topic" name="topic" required>
                        <option value="">Выберите товар</option>
                        <option value="1">Товар 1 (1000 руб.)</option>
                        <option value="2">Товар 2 (1500 руб.)</option>
                        <option value="3">Товар 3 (2000 руб.)</option>
                    </select>
                </div>

                <div class="order-form__field">
                    <label class="order-form__label" for="page-comment">Комментарий к доставке</label>
                    <textarea class="order-form__textarea" id="page-comment" name="comment" rows="3"
                        placeholder="Адрес или примечания"></textarea>
                </div>

                <div class="order-form__field">
                    <label>
                        <input class="order-form__input" type="checkbox" name="agreement" required>
                        Я согласен на обработку персональных данных
                    </label>
                </div>

                <div class="order-form__actions">
                    <button class="button button--primary" type="submit">Подтвердить заказ</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Учебный проект. Все права защищены.</p>
        <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </footer>

    <a class="scroll-top" href="#top" title="Наверх">↑</a>
</body>

</html>
